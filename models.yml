# Modelos del ODM para la fase 2.
#
# Los nombres van en minúscula, igual que las colecciones del juego de datos
# de referencia: los $lookup de consultas.py buscan "recinto", "artista",
# "evento" y "asistente". Los campos son los del esquema de la fase 2.
#
# evento no lleva índice único sobre titulo: titulo se repite una vez en los
# datos y el índice haría fallar initApp.

recinto:
  required_vars:
    - nombre
    - direccion
    - aforo
  admissible_vars:
    - ciudad
    - zonas
    - servicios
    - direccion_loc
  unique_indexes:
    - nombre
  regular_indexes:
    - aforo
  location_index: direccion

artista:
  required_vars:
    - nombre
    - generos
  admissible_vars:
    - pais
    - anio_inicio
  unique_indexes:
    - nombre
  regular_indexes:
    - generos

evento:
  required_vars:
    - titulo
    - artistas
    - recinto
    - fecha
  admissible_vars:
    - precios_por_zona
    - entradas_vendidas
    - estado
  unique_indexes: []
  regular_indexes:
    - fecha
    - recinto

asistente:
  required_vars:
    - nombre
    - email
    - direccion
  admissible_vars:
    - fecha_alta
    - preferencias
    - direccion_loc
  unique_indexes:
    - email
  regular_indexes: []
  location_index: direccion
